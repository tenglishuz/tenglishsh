<!DOCTYPE html>
<html lang="uz"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#4338ca">
<title>Tenglish</title>
<style>
:root{--bg:#f4f3ff;--cd:#fff;--tx:#161a3a;--mu:#6e7396;--ln:#e6e5f7;--fl:#eceafc;--ac:#3b3bf0;--on:#fff;--no:#e5484d;--ok:#1aa86a;--wm:#ff9f1c;--sh:0 2px 12px rgba(40,40,130,.07);--ez:cubic-bezier(.2,.8,.2,1)}
:root[data-t=dark]{--bg:#0d0e1f;--cd:#171933;--tx:#eceeff;--mu:#9296bd;--ln:#262a4d;--fl:#20234a;--ac:#8c8cff;--on:#0d0e1f;--no:#ff7a7f;--ok:#4ade9a;--wm:#ffb84d;--sh:0 2px 12px rgba(0,0,0,.35)}
:root[data-t=ocean]{--bg:#e8f5fa;--cd:#fff;--tx:#08283a;--mu:#547b8e;--ln:#cde5ef;--fl:#d9eff7;--ac:#0a7fb0;--on:#fff}
:root[data-t=sunset]{--bg:#fff1e8;--cd:#fff;--tx:#3a1706;--mu:#8a5a42;--ln:#f3d9c8;--fl:#fde5d4;--ac:#d9480f;--on:#fff}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%}
body{font:15px/1.5 "Avenir Next",ui-rounded,"SF Pro Rounded",system-ui,-apple-system,"Segoe UI",sans-serif;background:var(--bg);color:var(--tx);overflow-x:hidden;transition:background .35s,color .35s}
button,input,select,textarea{font:inherit;color:inherit}
button{border:0;background:none;cursor:pointer;padding:0;transition:transform .15s var(--ez),background .25s,color .25s,opacity .25s}
svg.i{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
:focus-visible{outline:3px solid var(--ac);outline-offset:2px}
input:focus-visible,select:focus-visible,textarea:focus-visible{outline:none}

/* Sahifa */
#v{max-width:640px;margin:0 auto;padding:calc(18px + env(safe-area-inset-top,0px)) 16px 140px;touch-action:pan-y}
body.tchat #v{padding-bottom:210px}
@media(min-width:900px){#v,.cb{max-width:900px}#nav{width:min(94vw,640px)}}
h2{font-size:24px;line-height:1.15;margin:2px 0 6px;letter-spacing:-.03em;font-weight:800}
.sub{color:var(--mu);margin:0 0 16px;font-size:14px}
.mu{color:var(--mu);font-size:13px}
.ph{font-size:12px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--ac);margin:18px 2px 8px}
.ph:first-child{margin-top:4px}

/* Kartalar */
.cd{background:var(--cd);border-radius:18px;padding:14px;margin-bottom:12px;box-shadow:var(--sh);overflow-wrap:anywhere}
button.cd{display:block;width:100%;text-align:left}
button.cd:active{transform:scale(.985)}
.cd.mu{font-size:13px}
.hero{background:var(--ac);color:var(--on);border-radius:24px;padding:18px;margin:14px 0 12px}
.hero p{margin:12px 0 14px;font-size:16px;line-height:1.4;font-weight:600}
.hero h2{margin:4px 0 6px}
.gr{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px;margin-bottom:12px}.gr .cd{margin:0}
.kp{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:10px;margin-bottom:12px}
.kp>div{background:var(--cd);border-radius:16px;padding:12px;box-shadow:var(--sh)}.kp b{display:block;font-size:21px;letter-spacing:-.03em}
.st{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:12px}
.st>div{background:var(--cd);border-radius:16px;padding:12px;display:flex;flex-direction:column;gap:2px;box-shadow:var(--sh)}
.st svg{color:var(--wm)}.st>div:nth-child(2) svg{color:var(--ac)}.st>div:nth-child(3) svg{color:var(--ok)}
.st>div:first-child svg{animation:flame 1.8s ease-in-out infinite;transform-origin:50% 90%}
.st b{font-size:22px;letter-spacing:-.03em;line-height:1.1}.st span{font-size:12px;color:var(--mu)}
.big{font-size:48px;font-weight:800;letter-spacing:-.05em;line-height:1;color:var(--ac)}

/* Tugma va chip */
.bt{background:var(--ac);color:var(--on);padding:10px 18px;border-radius:99px;font-weight:700;font-size:14.5px;display:inline-flex;gap:8px;align-items:center;justify-content:center}
.bt:active{transform:scale(.95)}
.bt.g{background:var(--fl);color:var(--tx)}
.bt.w{background:var(--on);color:var(--ac)}
.bt.dg{color:var(--no)}
.bt:disabled{opacity:.5}
.rw{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.chip{display:inline-flex;align-items:center;gap:4px;padding:7px 13px;border-radius:99px;background:var(--fl);font-size:13.5px;font-weight:600}
.chip:active{transform:scale(.95)}
.chip.on{background:var(--ac);color:var(--on)}
.on2{box-shadow:0 0 0 2.5px var(--ac)}

/* Formalar */
input:not([type=checkbox]):not([type=radio]):not([type=range]),select,textarea{width:100%;background:var(--fl);border:2px solid transparent;border-radius:14px;padding:10px 12px;outline:none;transition:border-color .2s,background .2s}
input:focus,select:focus,textarea:focus{border-color:var(--ac)}
input[type=range]{width:100%;accent-color:var(--ac);padding:0;margin:6px 0}
label{display:block;font-size:13px;color:var(--mu);margin:14px 0 6px;font-weight:600}
.ed{min-height:260px;font:17px/1.7 Georgia,"Times New Roman",serif;resize:vertical;background:var(--cd)!important;box-shadow:var(--sh)}
.sw{position:relative;display:block;width:46px;height:28px;margin:0;flex:none}
.sw input{position:absolute;inset:0;width:100%;height:100%;margin:0;opacity:0;z-index:2;cursor:pointer}
.sw i{position:absolute;inset:0;border-radius:99px;background:var(--ln);transition:background .3s}
.sw i::after{content:"";position:absolute;left:3px;top:3px;width:22px;height:22px;border-radius:50%;background:#fff;box-shadow:0 1px 4px rgba(0,0,0,.25);transition:transform .35s var(--ez)}
.sw input:checked+i{background:var(--ac)}
.sw input:checked+i::after{transform:translateX(18px)}
.sw input:focus-visible+i{outline:3px solid var(--ac);outline-offset:2px}
.sr{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:10px 0}
.sr:first-child{padding-top:0}.sr:last-child{padding-bottom:0}
.sr+.sr{border-top:1px solid var(--ln)}
.sr .mu{margin-top:1px}
.seg{display:flex;gap:4px;background:var(--cd);border-radius:99px;padding:4px;margin-bottom:6px;box-shadow:var(--sh)}
.seg button{flex:1;padding:8px 4px;border-radius:99px;font-size:13px;font-weight:700;color:var(--mu)}
.seg button.on{background:var(--ac);color:var(--on)}
.pfh{display:flex;align-items:center;gap:14px;margin:2px 0 14px}.pfh h2{margin:0}

/* Chat */
#log{display:flex;flex-direction:column;gap:8px}
.mr{display:flex;flex-direction:column;align-items:flex-start;gap:4px;align-self:stretch;max-width:100%}
.mr>.av{margin:0 0 0 4px}
.ms{width:fit-content;max-width:100%;padding:9px 13px;border-radius:18px;overflow-wrap:anywhere}
.ms .tx{white-space:pre-wrap}
.bot{background:var(--cd);border-bottom-left-radius:5px;box-shadow:var(--sh)}
.me{background:var(--ac);color:var(--on);border-bottom-right-radius:5px;align-self:flex-end;max-width:84%}
.ms .ac{display:flex;gap:8px;align-items:center;margin-top:6px}
.ms .ac .mu{display:inline-flex}
.nw{animation:pop .32s var(--ez) both}
.me.nw{transform-origin:100% 100%}.mr.nw{transform-origin:0 100%}
#cbar:empty{display:none}
.cb{position:fixed;left:0;right:0;bottom:calc(76px + env(safe-area-inset-bottom,0px));z-index:4;display:flex;gap:8px;max-width:640px;margin:0 auto;padding:16px 16px 0;align-items:flex-end;background:linear-gradient(transparent,var(--bg) 38%);animation:up .35s var(--ez) both}
.cb textarea{max-height:120px;resize:none;background:var(--cd);box-shadow:var(--sh)}
.cb .bt{width:44px;height:44px;padding:0;border-radius:50%;flex:none}
.dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--mu);margin:0 2px;animation:b 1s infinite}
.dot:nth-child(2){animation-delay:.15s}.dot:nth-child(3){animation-delay:.3s}

/* Menyu */
#nav{position:fixed;left:50%;bottom:calc(10px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:6;background:var(--cd);border-radius:99px;padding:5px;display:flex;box-shadow:0 6px 24px rgba(30,30,100,.16);width:min(94vw,460px);overflow-x:auto;scroll-snap-type:x proximity;scrollbar-width:none;overscroll-behavior-x:contain}
#nav::-webkit-scrollbar{display:none}
#nav .pl{position:absolute;top:5px;bottom:5px;left:0;width:0;border-radius:99px;background:var(--ac);transition:transform .38s var(--ez),width .38s var(--ez);z-index:0;pointer-events:none}
.nv{position:relative;z-index:1;flex:0 0 22%;display:flex;flex-direction:column;align-items:center;gap:2px;padding:7px 0;border-radius:99px;font-size:10.5px;font-weight:600;color:var(--mu);scroll-snap-align:center}
.nv span{white-space:nowrap}
.nv svg{transition:transform .35s var(--ez)}
.nv.on{color:var(--on)}.nv.on svg{transform:translateY(-1px) scale(1.12)}
#toast{position:fixed;left:50%;top:calc(14px + env(safe-area-inset-top,0px));transform:translateX(-50%) translateY(-90px);opacity:0;background:var(--tx);color:var(--bg);padding:9px 16px;border-radius:99px;font-size:14px;max-width:90vw;text-align:center;transition:transform .4s var(--ez),opacity .3s;pointer-events:none;z-index:9}
#toast.on{transform:translateX(-50%);opacity:1}

/* Ustoz avatari */
.av{display:inline-block;flex:none;line-height:0;border-radius:50%;animation:bob 3.8s ease-in-out infinite}
.av svg{width:100%;height:100%;display:block}
.av .ey,.av .mt,.av .mo{transform-box:fill-box;transform-origin:center}
.av .ey{animation:blink 4.4s infinite}
.av .mt{opacity:0}
body.talk .av .mo{opacity:0}
body.talk .av .mt{opacity:1;animation:talk .26s ease-in-out infinite alternate}
body.think .av{animation:wob 1.1s ease-in-out infinite}
body.think .av .pu{animation:look 1.2s ease-in-out infinite}
.tc{gap:12px;flex-wrap:nowrap}
.tc.sel .av{animation:pop .5s var(--ez) both,bob 3.8s ease-in-out .5s infinite}

/* Boshqa elementlar */
.bar{height:8px;border-radius:4px;background:var(--fl);overflow:hidden;margin-top:6px}
.bar i{display:block;height:100%;background:var(--ac);border-radius:4px;animation:grow .8s var(--ez) both}
.er{background:var(--fl);border-radius:14px;padding:10px 12px;margin:8px 0;overflow-wrap:anywhere}
.er s{color:var(--no)}.er u{color:var(--ok);text-decoration:none;font-weight:700}
mark{color:inherit;border-radius:4px;padding:0 2px}
.hl-r{background:#e5484d33;border-bottom:2px solid var(--no)}.hl-y{background:#ff9f1c40}.hl-g{background:#1aa86a33}.hl-l{background:#3b3bf026;font-weight:700}
.sn{padding:8px 12px;margin:6px 0;border-radius:12px;background:var(--fl)}
.r-t{border-left:5px solid #3b82f6}.r-s{border-left:5px solid #f5b301}.r-e{border-left:5px solid #1aa86a}.r-c{border-left:5px solid #9b5de5}
.warn{background:#ff9f1c26;border-radius:14px;padding:10px 14px;margin:8px 0;font-size:14px}
.bd{opacity:.4;filter:grayscale(1);transition:opacity .3s,filter .3s}.bd.on{opacity:1;filter:none}
.pr{display:flex!important;align-items:center;gap:12px;width:100%;text-align:left}
.pn,.qn{width:30px;height:30px;border-radius:10px;background:var(--fl);color:var(--ac);font-weight:800;display:flex;align-items:center;justify-content:center;flex:none}
.qn{width:26px;height:26px;border-radius:50%;font-size:13px}
.rq{display:flex;gap:10px;align-items:flex-start}
.op{display:block;width:100%;text-align:left;background:var(--fl);border-radius:12px;padding:9px 12px;margin-top:6px;border:2px solid transparent}
.op:active{transform:scale(.98)}
.op.on{border-color:var(--ac)}.op.ok{background:var(--ok);color:#fff}.op.no{background:var(--no);color:#fff}
.pass{font:16px/1.7 Georgia,serif;white-space:pre-wrap;margin-top:8px}
.gp{display:inline-block!important;width:92px!important;padding:3px 6px!important;margin:0 2px!important;border-radius:8px;text-align:center;font:600 14px/1.3 system-ui,sans-serif}
span.gp{width:auto!important;padding:1px 8px!important}span.gp.ok{background:#2fb34440}span.gp.no{background:#e5484d40}
.skl{height:12px;border-radius:6px;background:var(--fl);margin:8px 0;animation:sk 1.2s infinite}
.tip{border-left:4px solid var(--ac)}.wr{border-left:4px solid var(--no)}.gd{border-left:4px solid var(--ok)}
.tlb{height:10px;border-radius:5px;background:var(--fl);overflow:hidden;margin-top:8px}.tlb i{display:block;height:100%;transition:width .25s linear,background .3s}
.tld{display:flex;gap:6px;margin-top:8px}.tld span{flex:1;text-align:center;font-size:11px;font-weight:700;padding:4px 0;border-radius:8px;background:var(--fl);color:var(--mu)}
details>summary{cursor:pointer}

/* Animatsiyalar */
@keyframes pop{from{opacity:0;transform:translateY(8px) scale(.92)}to{opacity:1;transform:none}}
@keyframes up{from{opacity:0;transform:translateY(24px)}to{opacity:1;transform:none}}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes inR{from{opacity:0;transform:translateX(48px)}to{opacity:1;transform:none}}
@keyframes inL{from{opacity:0;transform:translateX(-48px)}to{opacity:1;transform:none}}
@keyframes grow{from{width:0}}
@keyframes b{50%{opacity:.2;transform:translateY(-3px)}}
@keyframes sk{50%{opacity:.4}}
@keyframes flame{0%,100%{transform:rotate(-5deg) scale(1)}50%{transform:rotate(5deg) scale(1.12)}}
@keyframes bob{50%{transform:translateY(-2px)}}
@keyframes wob{0%,100%{transform:rotate(-5deg)}50%{transform:rotate(5deg)}}
@keyframes blink{0%,93%,100%{transform:scaleY(1)}96%{transform:scaleY(.1)}}
@keyframes look{0%,100%{transform:translateX(-1.3px)}50%{transform:translateX(1.3px)}}
@keyframes talk{from{transform:scaleY(.35)}to{transform:scaleY(1.15)}}
#v.inR{animation:inR .4s var(--ez) both}
#v.inL{animation:inL .4s var(--ez) both}
#v.anim>*{animation:rise .45s var(--ez) both}
#v.anim>:nth-child(2){animation-delay:.04s}#v.anim>:nth-child(3){animation-delay:.08s}#v.anim>:nth-child(4){animation-delay:.12s}
#v.anim>:nth-child(5){animation-delay:.16s}#v.anim>:nth-child(6){animation-delay:.2s}#v.anim>:nth-child(n+7){animation-delay:.24s}
body.noanim *,body.noanim *::before,body.noanim *::after{animation:none!important;transition:none!important}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* ===== v6: effektlar, vazifalar, yangi bo'limlar ===== */
.st{grid-template-columns:repeat(auto-fit,minmax(74px,1fr))}.st span{font-size:11.5px}.st>div:nth-child(4) svg{color:var(--no)}
.bt,.chip,.op,.nv,.seg button,.tkb,button.cd{position:relative;overflow:hidden}
.rp{position:absolute;border-radius:50%;background:currentColor;opacity:.28;transform:scale(0);animation:rpl .6s ease-out forwards;pointer-events:none}
@keyframes rpl{to{transform:scale(1);opacity:0}}
@media(hover:hover){button.cd:hover{transform:translateY(-2px);box-shadow:0 6px 22px rgba(40,40,130,.14)}.bt:hover{filter:brightness(1.07)}.chip:hover{transform:translateY(-1px)}}
.hero{background-image:linear-gradient(125deg,var(--ac),color-mix(in srgb,var(--ac) 60%,#ff4fd8),var(--ac));background-size:220% 220%;animation:gl 9s ease infinite}
@keyframes gl{50%{background-position:100% 50%}}
body::before{content:"";position:fixed;inset:-25%;z-index:-1;pointer-events:none;background:radial-gradient(38% 30% at 18% 12%,color-mix(in srgb,var(--ac) 16%,transparent),transparent),radial-gradient(34% 28% at 86% 82%,color-mix(in srgb,var(--ok) 11%,transparent),transparent);animation:drift 20s ease-in-out infinite alternate}
@keyframes drift{to{transform:translate(4%,3%) scale(1.08)}}
.bar i{position:relative;overflow:hidden}
.bar i::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,transparent,rgba(255,255,255,.45),transparent);transform:translateX(-100%);animation:shn 2.6s ease-in-out infinite}
@keyframes shn{60%,100%{transform:translateX(100%)}}
.skl{background:linear-gradient(90deg,var(--fl) 25%,var(--ln) 50%,var(--fl) 75%);background-size:200% 100%;animation:shm 1.3s linear infinite}
@keyframes shm{to{background-position:-200% 0}}
.nw{animation:pop2 .45s cubic-bezier(.34,1.56,.64,1) both}
@keyframes pop2{from{opacity:0;transform:translateY(12px) scale(.86)}to{opacity:1;transform:none}}
.nv.on svg{animation:nvb .5s cubic-bezier(.34,1.56,.64,1)}
@keyframes nvb{0%{transform:scale(.7)}60%{transform:translateY(-3px) scale(1.25)}100%{transform:translateY(-1px) scale(1.12)}}
@keyframes hop{0%,100%{transform:translateY(0)}35%{transform:translateY(-9px) scale(1.08)}65%{transform:translateY(0) scale(.96)}}
@keyframes shk{0%,100%{transform:translateX(0)}20%,60%{transform:translateX(-4px)}40%,80%{transform:translateX(4px)}}
@keyframes wig{0%,100%{transform:rotate(0)}25%{transform:rotate(-12deg)}75%{transform:rotate(12deg)}}
body.happy .av{animation:hop .55s ease-out 2}body.sad .av{animation:shk .5s ease-in-out 1}body.wave .av{animation:wig .6s ease-in-out 2}
.fl{position:fixed;left:50%;top:36%;z-index:12;font-weight:800;font-size:28px;color:var(--ok);pointer-events:none;text-shadow:0 2px 14px rgba(0,0,0,.25);animation:fly 1.4s var(--ez) forwards;white-space:nowrap}.fl.no{color:var(--no)}
@keyframes fly{0%{opacity:0;transform:translate(-50%,16px) scale(.6)}20%{opacity:1;transform:translate(-50%,0) scale(1.15)}100%{opacity:0;transform:translate(-50%,-90px) scale(1)}}
.cfw{position:fixed;inset:0;pointer-events:none;z-index:13;overflow:hidden}.cfw i{position:absolute;top:62%;border-radius:2px;animation:cf 1.9s cubic-bezier(.2,.7,.3,1) forwards}
@keyframes cf{0%{transform:translate(0,0) rotate(0);opacity:1}35%{transform:translate(calc(var(--dx)*.5),var(--dy)) rotate(calc(var(--r)*.35))}100%{transform:translate(var(--dx),60vh) rotate(var(--r));opacity:0}}
#toast.ok{background:var(--ok);color:#fff}#toast.no{background:var(--no);color:#fff}
#v.anim .gr>*,#v.anim .kp>div{animation:rise .5s var(--ez) both}
#v.anim .gr>:nth-child(2),#v.anim .kp>:nth-child(2){animation-delay:.05s}#v.anim .gr>:nth-child(3),#v.anim .kp>:nth-child(3){animation-delay:.1s}#v.anim .gr>:nth-child(4),#v.anim .kp>:nth-child(4){animation-delay:.15s}#v.anim .gr>:nth-child(n+5),#v.anim .kp>:nth-child(n+5){animation-delay:.2s}
.tkb{width:44px;height:44px;border-radius:50%;background:var(--cd);box-shadow:var(--sh);display:flex;align-items:center;justify-content:center;flex:none;color:var(--ac)}
.tb{position:absolute;top:2px;right:2px;min-width:17px;height:17px;border-radius:9px;background:var(--no);color:#fff;font-size:10.5px;font-weight:800;line-height:1;display:flex;align-items:center;justify-content:center;padding:0 4px;pointer-events:none;box-shadow:0 0 0 2px var(--cd)}
@keyframes pls{50%{transform:scale(1.18)}}
.nv .tb{top:3px;right:auto;left:calc(50% + 5px)}
.nv.on .tb{box-shadow:0 0 0 2px var(--ac)}
.tkw{position:relative;flex:none;width:44px;height:44px}
.tkw .tb{top:-3px;right:-3px;box-shadow:0 0 0 2px var(--bg)}
.tkbar{position:sticky;top:0;z-index:5;display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:nowrap;padding:calc(6px + env(safe-area-inset-top,0px)) 0 8px;margin:calc(-1 * env(safe-area-inset-top,0px)) 0 6px;background:linear-gradient(var(--bg) 78%,transparent)}
.bk{display:inline-flex;align-items:center;gap:4px;padding:8px 16px 8px 9px;border-radius:99px;background:var(--cd);box-shadow:var(--sh);color:var(--ac);font-weight:700;font-size:14.5px}
.bk:active{transform:scale(.95)}
.tkn{display:flex;align-items:center;gap:8px;width:100%;margin-top:8px;padding:9px 12px;border-radius:14px;background:var(--fl);color:var(--ac);font-weight:700;font-size:13.5px;text-align:left}
.tkn span{flex:1;min-width:0}
.tkn:active{transform:scale(.98)}
:root[data-t=forest]{--bg:#eef7f0;--cd:#fff;--tx:#0f2a1a;--mu:#5b7a66;--ln:#d3e8d9;--fl:#e0f1e5;--ac:#1f8a4c;--on:#fff}
:root[data-t=rose]{--bg:#fff0f4;--cd:#fff;--tx:#3a0f1d;--mu:#8a5566;--ln:#f5d6df;--fl:#fde3ea;--ac:#d6336c;--on:#fff}
:root[data-t=sand]{--bg:#faf5ea;--cd:#fff;--tx:#33291a;--mu:#85775c;--ln:#eadfc6;--fl:#f3ead4;--ac:#a0722a;--on:#fff}

1:{n:6,s:1,r:'1–6',t:"Gap-fill: bitta so'z",ins:"Read the text. Fill in each gap with ONE word. You must use a word which is somewhere in the rest of the text.",tip:"Maslahat: javob so'zi har doim matnning ichida va bo'shliqdan OLDIN (tepada) yozilgan. Bo'shliqdagi gapni o'qib, tepada shu haqda nima deyilganini qidir.",g:`Bitta bog'langan, BIR ABZASLI matn (200-250 so'z; birinchi shaxsdan (I/we), o'tgan zamonda oddiy jonli hikoya: bir kunlik tashrif, sayohat yoki bayram; odatiy kundalik tafsilotlar, joylar/hayvonlar/buyumlar nomlari matnda bir necha marta takrorlansin). Matnda 6 ta bo'shliq [1],[2],[3],[4],[5],[6] tartib bilan, har biri AYNAN bitta so'z o'rnida. QOIDALAR: (1) Har bir javob so'zi matnda shu bo'shliqdan OLDIN (tepada) aynan o'sha shaklda (ko'plik va zamon o'zgarmagan) kamida bir marta yozilgan bo'lsin; javob hech qachon faqat bo'shliqdan keyin uchramasin. (2) Javob mazmunli so'z (ot, -ing fe'l, sifat), kamida 3 harf; artikl, predlog, olmosh yoki bog'lovchi bo'lmasin. (3) Bo'shliq gapi grammatik va mantiqan faqat shu so'zni talab qilsin (masalan "The [1] was bustling with people": tepada "...went to the city zoo" deyilgan, javob "zoo"). (4) 1-bo'shliq kamida 2-gapdan keyin kelsin, bo'shliqlar matn bo'ylab teng tarqalgan, 6 ta javob bir-biridan farqli bo'lsin. Mavzuni yangi tanla. qs: 6 ta, q="Gap 1".., a=to'g'ri so'z (string), opts va o bo'sh, why=o'zbekcha: "Tepada '...' deyilgan, shu sababli ...".`},
2:{n:8,s:7,r:'7–14',t:"Matn va holatni moslash",ins:"Read the texts 7–14 and statements A–J. Decide which situation described in the statements matches with the given texts. Each statement can be used ONCE only. There are TWO extra statements which you do not need to use.",g:`8 ta qisqa matn (har biri 30-45 so'z, 2-3 gap). Hammasi BITTA umumiy mavzuning 8 xil turini tasvirlaydi (masalan aviakompaniya turlari, mehmonxona turlari, maktab turlari, transport turlari, do'kon turlari); har biri "These airlines ..." / "These hotels ..." kabi ta'rif uslubida boshlansin (bittasi "This term is often used to refer to ..." bilan boshlanishi mumkin), turning nomini ochiq aytmasdan xususiyatlarini tasvirlasin. opts: 10 ta holat/ehtiyoj gapi (A-J), har biri 6-16 so'zli, "You need ...", "If you want to ...", "They provide ...", "These ... take you ..." uslubida, masalan "You need minimal services for a low price." 8 tasi aynan bitta matnga mos (matndagi so'zlarni nusxalamay, parafraz qilib), 2 tasi hech bir matnga mos emas (ortiqcha; mavzuga yaqin yoki mavzudan butunlay tashqari, masalan tibbiy xizmat, ekskursiya). Ba'zi gaplar ikki matnga yaqin ko'rinsin, lekin FAQAT bittasiga to'liq mos kelsin. opts tartibi matnlar tartibiga mos kelmasin (aralash). qs: 8 ta, q=matnning to'liq o'zi, a=opts indeksi (har biri boshqa). text bo'sh.`},

4:{n:9,s:21,r:'21–29',t:"A/B/C/D va Yes/No/Not Given",ins:"Questions 21–24: choose the correct answer A, B, C or D. Questions 25–29: decide if the statements agree with the information given: A) Yes B) No C) Not given.",g:`600-700 so'zli ilmiy-ommabop matn (AYNAN 4 ta abzas, har biri 140-190 so'z, abzaslar bo'sh qator \n\n bilan ajratilsin). Tabiat, geografiya yoki fan jarayoni haqida (masalan muzliklar, vulqonlar, okeanlar, iqlim, ekotizim): aniq raqamlar, joy nomlari, ilmiy atamalar, sabab-oqibat va taqqoslash ("while", "in contrast"), ta'riflar va misollar bilan. qs: 9 ta. Birinchi 4 tasi (21-24) 4 variantli ko'p tanlov (o=4 ta), matn tartibida; savol uslubi: "Which of the following statements correctly describes ...?", "What is the main reason ...?", "What ... is created when ...?"; variantlar bir xil uzunlikda, noto'g'ri variantlar matndagi so'zlarni ishlatsin, lekin ma'nosi noto'g'ri bo'lsin. Keyingi 5 tasi (25-29) matn haqidagi gap, o=["Yes","No","Not Given"] (a: 0=matn tasdiqlaydi, 1=matn rad etadi, 2=matnda yo'q); uchala turdan ham kamida bittadan bo'lsin. ev=matndan aynan ko'chirilgan bo'lak (Not Given da bo'sh).`},

if(n)toast("+"+n+" so'z lug'atga");if(fin&&!tk)setTimeout(()=>tkFromMsg(r.replace(/\[\[[\s\S]*?\]\]/g,'').trim()),500);

/* ---- Bulut: siqish ---- */
async function zip(str){
 if(typeof CompressionStream=='undefined')return {e:'raw',d:str};
 const cs=new CompressionStream('gzip'),w=cs.writable.getWriter();w.write(new TextEncoder().encode(str));w.close();
 const u=new Uint8Array(await new Response(cs.readable).arrayBuffer());let b='';for(let i=0;i<u.length;i+=8192)b+=String.fromCharCode.apply(null,u.subarray(i,i+8192));return {e:'gz',d:btoa(b)}}
async function unzip(c){
 if(c.e!='gz')return c.d;
 if(typeof DecompressionStream=='undefined')throw new Error("Bu brauzer siqilgan ma'lumotni ocha olmaydi. Chrome yoki Safari'ni yangilang.");
 const bin=atob(c.d),u=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)u[i]=bin.charCodeAt(i);
 const ds=new DecompressionStream('gzip'),w=ds.writable.getWriter();w.write(u);w.close();
 return await new Response(ds.readable).text()}
async function cloudPack(){
 const o=JSON.parse(JSON.stringify(S));
 ['cloud','uid','upd'].forEach(k=>delete o[k]);
 if(!S.cloud.keys)['keys','rsv','prov','models','lists'].forEach(k=>delete o[k]);
 let z=await zip(JSON.stringify(o));
 for(const step of [()=>{delete o.chat;delete o.vq},()=>{o.hist=(o.hist||[]).slice(0,60);o.errx=(o.errx||[]).slice(0,300)},()=>{delete o.rd;delete o.spk;delete o.mock}]){
  if(z.d.length<=900000)break;step();z=await zip(JSON.stringify(o))}
 if(z.d.length>900000)throw Object.assign(new Error("Ma'lumot juda katta, bulutga sig'madi."),{code:'big'});
 return z}
function cErr(e){const c=String((e&&e.code)||'');
 if(/permission-denied/.test(c)){SY.rules=1;return "Firestore ruxsat bermadi. Firebase Console'da Firestore Database yarating va quyidagi qoidalarni qo'ying."}
 if(/not-found|failed-precondition/.test(c)){SY.rules=1;return "Firestore Database yaratilmagan yoki yoqilmagan. Firebase Console'da yarating va qoidalarni qo'ying."}
 if(/unavailable|network/.test(c))return "Internet yo'q. Ulanish qaytganda qayta urinib ko'riladi.";
 return (e&&e.message)||'Bulut xatosi'}

service cloud.firestore {
  match /databases/{database}/documents {

    function signedIn() { return request.auth != null; }
    function isRoot() {
      return signedIn()
        && request.auth.token.email == '${ADMIN}'
        && request.auth.token.email_verified == true;
    }
    function isAdmin() {
      return isRoot() || (signedIn()
        && request.auth.token.email_verified == true
        && exists(/databases/$(database)/documents/config/admins)
        && request.auth.token.email in get(/databases/$(database)/documents/config/admins).data.emails);
    }
    function notBanned() {
      return !exists(/databases/$(database)/documents/bans/$(request.auth.uid));
    }

    // Admin panel
    match /bans/{uid} {
      allow read: if isAdmin() || (signedIn() && request.auth.uid == uid);
      allow write: if isAdmin();
    }
    // Adminlar ro'yxati
    match /config/{doc} {
      allow read: if signedIn();
      allow create, update: if isAdmin() && doc == 'admins'
        && request.resource.data.emails is list
        && request.resource.data.emails.hasAll(['${ADMIN}']);
    }
    // Ustoz ma'lumotini tozalash buyrug'i
    match /resets/{uid} {
      allow read: if isAdmin() || (signedIn() && request.auth.uid == uid);
      allow write: if isAdmin();
    }
    // Admin so'rovlari va javoblar
    match /reqs/{id} {
      allow read: if isAdmin() || (signedIn() && notBanned()
        && (resource.data.to == request.auth.uid || resource.data.to == 'all'));
      allow create, update, delete: if isAdmin();
      match /replies/{uid} {
        allow read: if isAdmin() || (signedIn() && request.auth.uid == uid);
        allow create, update: if signedIn() && request.auth.uid == uid && notBanned()
          && request.resource.data.text is string && request.resource.data.text.size() <= 1000;
        allow delete: if isAdmin();
      }
    }
    match /presence/{uid} {
      allow read: if isAdmin() || (signedIn() && request.auth.uid == uid);
      allow create, update: if signedIn() && request.auth.uid == uid && notBanned();
      allow delete: if isAdmin();
    }

    // Bulut sinxronlash
    match /users/{uid} {
      allow read, write: if signedIn() && request.auth.uid == uid && notBanned();
    }

    // Do'stlar bo'limi
    match /profiles/{uid} {
      allow read: if signedIn() && notBanned();
      allow write: if signedIn() && request.auth.uid == uid && notBanned();
    }
    match /codes/{c} {
      allow read: if signedIn();
      allow create: if signedIn() && notBanned() && request.resource.data.uid == request.auth.uid;
      allow delete: if signedIn() && resource.data.uid == request.auth.uid;
    }
    match /usernames/{u} {
      allow read: if signedIn();
      allow create, update: if signedIn() && notBanned() && request.resource.data.uid == request.auth.uid;
      allow delete: if signedIn() && resource.data.uid == request.auth.uid;
    }
    match /friends/{uid}/list/{fid} {
      allow read: if signedIn() && request.auth.uid == uid;
      allow write: if signedIn() && notBanned() && (request.auth.uid == uid || request.auth.uid == fid);
    }
    match /friendReqs/{id} {
      allow get: if signedIn() && (id.split('_')[0] == request.auth.uid || id.split('_')[1] == request.auth.uid);
      allow list: if signedIn() && resource.data.to == request.auth.uid;
      allow create: if signedIn() && notBanned() && request.resource.data.from == request.auth.uid;
      allow delete: if signedIn() && (resource.data.from == request.auth.uid || resource.data.to == request.auth.uid);
    }
    match /chats/{cid}/msgs/{m} {
      allow read: if signedIn() && request.auth.uid in cid.split('_');
      allow create: if signedIn() && notBanned() && request.auth.uid in cid.split('_') && request.resource.data.from == request.auth.uid;
    }
  }
}`;

<div class="ph">Yangi admin tayinlash</div><div class="cd"><label style="margin-top:0">Foydalanuvchi emaili</label><input id="admn" list="adml" placeholder="email@gmail.com" autocomplete="off" autocapitalize="none"><datalist id="adml">${em.map(e=>`<option value="${esc(e)}">`).join('')}</datalist><button class="bt" style="margin-top:12px;width:100%" onclick="admAdd()">Admin qilib tayinlash</button><p class="mu" style="margin:10px 0 0">Google hisobining emaili. Yangi admin foydalanuvchilarni ko'ra oladi, ban qila oladi va boshqa admin tayinlay oladi.</p></div>`}

 try{await x.F.setDoc(x.F.doc(x.db,'config','admins'),{emails:[ADMIN,...list.filter(e=>e!=ADMIN)],by:LG.user.email,at:x.F.serverTimestamp()});toast(msg,'ok')}catch(e){toast(eMsg(e),'no')}}

 rq=[...AD.reqs].sort((a,b)=>(b.at&&b.at.toMillis?b.at.toMillis():Date.now())-(a.at&&a.at.toMillis?a.at.toMillis():Date.now()));
 return `<div class="cd"><label style="margin-top:0">Kimga</label><select id="rqw" onchange="AD.cmp.to=this.value"><option value="all" ${c.to=='all'?'selected':''}>Hamma foydalanuvchilarga</option>${us.map(r=>`<option value="${esc(r.id)}" ${c.to==r.id?'selected':''}>${esc(r.name||r.email||r.id)}</option>`).join('')}</select>
<label>Turi</label><select id="rqk" onchange="AD.cmp.kind=this.value;aPaint(1)">${Object.keys(KN).map(k=>`<option value="${k}" ${c.kind==k?'selected':''}>${k=='ask'?'Savol (javob kutiladi)':KN[k]}</option>`).join('')}</select>
${c.kind=='grant'?`<label>Ball miqdori</label><input id="rqn" type="number" min="1" max="1000" value="${+c.n||20}" oninput="AD.cmp.n=+this.value">`:''}
<label>Matn</label><textarea id="rqt" rows="4" maxlength="600" oninput="AD.cmp.text=this.value" placeholder="Savol yoki xabar matni">${esc(c.text)}</textarea>
<button class="bt" style="margin-top:12px;width:100%" onclick="adSend()">Yuborish</button></div>
<div class="ph">Yuborilganlar</div>${rq.length?rq.map(r=>{const ms=r.at&&r.at.toMillis?r.at.toMillis():0,rp=AD.rp[r.id];
 return `<div class="cd"><div class="rw" style="justify-content:space-between;flex-wrap:nowrap"><b>${KN[r.kind]||r.kind} → ${esc(toName(r.to))}</b><span class="mu">${ago(ms)}</span></div><p style="margin:8px 0">${esc(r.text||'')}${r.kind=='grant'?' <b>(+'+(+r.n||0)+' ball)</b>':''}</p>
<div class="rw"><button class="bt g" onclick="adRp('${esc(r.id)}')">Javoblar${rp?' ('+rp.length+')':''}</button><button class="bt dg g" onclick="adDel('${esc(r.id)}')">O'chirish</button></div>
${rp?(rp.length?rp.map(x=>`<div class="er" style="margin-top:8px"><b>${esc(x.name||x.email||'')}</b> <span class="mu">${ago(x.at&&x.at.toMillis?x.at.toMillis():0)}</span><div>${esc(x.text||'')}</div></div>`).join(''):'<div class="mu" style="margin-top:8px">Hali javob yo\'q.</div>'):''}</div>`}).join(''):'<div class="cd mu" style="text-align:center">Hali so\'rov yuborilmagan.</div>'}`}
window.adTo=(uid,kind)=>{AD.cmp.to=uid;AD.cmp.kind=kind;AD.sub='msg';AD.sel=null;draw(0,0);scrollTo(0,0)};
window.adSend=async()=>{if(!isAdm())return;const x=fx(),c=AD.cmp,tx=String(c.text||'').trim().slice(0,600);if(!x)return;
 if(!tx)return toast('Matn yozing','no');
 if(c.kind=='grant'&&!(c.n>=1&&c.n<=1000))return toast("Ball 1 dan 1000 gacha bo'lsin",'no');
 try{await x.F.addDoc(x.F.collection(x.db,'reqs'),{to:c.to,kind:c.kind,text:tx,n:c.kind=='grant'?Math.round(c.n):0,by:LG.user.email,at:x.F.serverTimestamp()});
  AD.cmp.text='';toast('Yuborildi','ok');aPaint(1)}catch(e){toast(eMsg(e),'no')}};

window.adDel=async id=>{const x=fx();if(!x||!isAdm())return;if(!confirm("So'rov va barcha javoblar o'chirilsinmi?"))return;
 try{const s=await x.F.getDocs(x.F.collection(x.db,'reqs',id,'replies'));for(const d of s.docs)await x.F.deleteDoc(d.ref);await x.F.deleteDoc(x.F.doc(x.db,'reqs',id));delete AD.rp[id];toast("O'chirildi",'ok')}catch(e){toast(eMsg(e),'no')}};
window.adCsv=()=>{const q=v=>'"'+String(v==null?'':v).replace(/"/g,'""')+'"',H=['Ism','Email','Username','Level','Ball','XP','Ketma-ket kun','Ishlar','Oxirgi faollik','Ban'];
 const rows=listRows().map(r=>[r.name,r.email,r.un,r.lv||1,r.sco||0,r.xp||0,r.st||0,r.n||0,fmt(seenOf(r)),AD.bans[r.id]?'ha':'']);
 const csv='\ufeff'+[H,...rows].map(a=>a.map(q).join(',')).join('\n'),a=document.createElement('a');
 a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));a.download='foydalanuvchilar.csv';document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},500)};
/* ---- foydalanuvchi tomoni: admin so'rovlari ---- */
const RQ={m:{},u:[],skip:{},open:0,tm:0};
function rqStop(){RQ.u.forEach(f=>{try{f()}catch(e){}});RQ.u=[];RQ.m={};const e=document.getElementById('rqm');if(e)e.remove();RQ.open=0}
function rqWatch(){rqStop();const x=fx();if(!x||!LG.user)return;const {F,db}=x,me=LG.user.uid;
 const on=s=>{s.docs.forEach(d=>{RQ.m[d.id]={id:d.id,...d.data()}});rqShow()};
 try{RQ.u.push(F.onSnapshot(F.query(F.collection(db,'reqs'),F.where('to','==',me)),on,()=>{}));
  RQ.u.push(F.onSnapshot(F.query(F.collection(db,'reqs'),F.where('to','==','all')),on,()=>{}))}catch(e){}
 clearInterval(RQ.tm);RQ.tm=setInterval(rqShow,4000)}
function rqShow(){if(RQ.open||window.DEMO||!LG.user||!document.body.classList.contains('lgok'))return;
 const me=String(LG.user.email||'').toLowerCase(),done=S.rqd=S.rqd||{},now=Date.now();
 const L=Object.values(RQ.m).filter(r=>r.at&&r.at.toMillis&&!done[r.id]&&!RQ.skip[r.id]&&now-r.at.toMillis()<12096e5&&String(r.by||'').toLowerCase()!=me).sort((a,b)=>a.at.toMillis()-b.at.toMillis());
 if(!L.length)return;const r=L[0];RQ.open=1;
 const d=document.createElement('div');d.id='rqm';d.style.cssText='position:fixed;inset:0;z-index:99990;background:rgba(0,0,0,.55);display:flex;align-items:center;justify-content:center;padding:20px';
 const ask=r.kind=='ask';
 d.innerHTML=`<div class="cd" style="max-width:420px;width:100%;max-height:90vh;overflow:auto"><b style="font-size:18px">${r.kind=='grant'?'Administratordan sovg\'a':'Administratordan '+(ask?'savol':'xabar')}</b><p style="white-space:pre-wrap;margin:10px 0">${esc(r.text||'')}</p>${r.kind=='grant'?`<p><b>+${+r.n||0} ball</b></p>`:''}${ask?`<textarea id="rqa" rows="4" maxlength="1000" placeholder="Javobingiz" style="width:100%"></textarea>`:''}<div class="rw" style="margin-top:12px">${ask?`<button class="bt" id="rqs" onclick="rqSend('${esc(r.id)}')">Yuborish</button><button class="bt g" onclick="rqLater('${esc(r.id)}')">Keyinroq</button>`:`<button class="bt" onclick="rqAck('${esc(r.id)}')">Tushunarli</button>`}</div></div>`;
 document.body.appendChild(d)}
function rqClose(id,final){const e=document.getElementById('rqm');if(e)e.remove();RQ.open=0;if(final){S.rqd=S.rqd||{};S.rqd[id]=1;save()}else RQ.skip[id]=1;setTimeout(rqShow,300)}
window.rqLater=id=>rqClose(id,0);
async function rqReply(id,text){const x=fx();if(!x||!LG.user)return false;
 try{await x.F.setDoc(x.F.doc(x.db,'reqs',id,'replies',LG.user.uid),{name:S.name||LG.user.name||'',email:LG.user.email||'',text:String(text).slice(0,1000),at:x.F.serverTimestamp()});return true}catch(e){return false}}
window.rqSend=async id=>{const a=document.getElementById('rqa'),v=String((a&&a.value)||'').trim();if(!v)return toast('Javob yozing','no');
 const b=document.getElementById('rqs');if(b)b.disabled=true;
 if(await rqReply(id,v)){toast('Javob yuborildi','ok');rqClose(id,1)}else{if(b)b.disabled=false;toast("Yuborib bo'lmadi. Internetni tekshiring",'no')}};
window.rqAck=async id=>{const r=RQ.m[id];if(r&&r.kind=='grant'&&!(S.rqd||{})[id]){S.xp=(S.xp||0)+Math.max(0,Math.min(1000,+r.n||0));toast('+'+(+r.n||0)+' ball','ok')}
 rqReply(id,r&&r.kind=='grant'?"Sovg'ani oldi":"O'qidi");rqClose(id,1)};
window.adReset=async uid=>{if(!isAdm())return;const r=AD.rows.find(z=>z.id==uid),x=fx();if(!r||!x)return;
 if(!confirm((r.name||r.email)+" va ustoz o'rtasidagi hamma ma'lumot (suhbat, dars jarayoni, daraja, dars vazifalari) o'chiriladi va dars boshidan boshlanadi. Davom etilsinmi?"))return;
 try{await x.F.setDoc(x.F.doc(x.db,'resets',uid),{at:x.F.serverTimestamp(),by:LG.user.email});toast("Tozalash buyrug'i yuborildi: foydalanuvchi ilovani ochganda amalga oshadi",'ok')}catch(e){toast(eMsg(e),'no')}};

function rstStop(){if(RST){try{RST()}catch(e){}RST=null}}
function rstWatch(){rstStop();const x=fx();if(!x||!LG.user)return;const {F,db}=x;
 try{RST=F.onSnapshot(F.doc(db,'resets',LG.user.uid),s=>{if(!s.exists())return;const a=s.data().at,ms=a&&a.toMillis?a.toMillis():0;

  try{setLog.n=0}catch(e){}save();toast("Ustoz ma'lumotlari administrator tomonidan tozalandi. Dars boshidan boshlanadi",'ok');
  try{if(typeof CH!='undefined')CH.t=0;draw(0,1)}catch(e){}},()=>{})}catch(e){}}

function admWatch(){admStop();const x=fx();if(!x||!LG.user)return;const {F,db}=x;
 try{ADM.unsub=F.onSnapshot(F.doc(db,'config','admins'),s=>{const d=s.exists()?s.data():{},e=Array.isArray(d.emails)?d.emails:[];
  ADM.list=[...new Set([ADMIN,...e.map(v=>String(v).toLowerCase().trim()).filter(Boolean)])];setAdmin(isAdm());if(typeof tab!='undefined'&&tab=='admin'&&AD.sub=='adm')aPaint(1)},
  ()=>{ADM.list=[ADMIN];setAdmin(isAdm())})}catch(e){}}

 if(window.DEMO)return;
